name: Deploy AI Tools Hub (sandbox)

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: user-fcbuseecayaj
  WEBAPP_NAME: aihub-test-24653

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package site
        run: |
          cd site
          zip -r ../site.zip .

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy zip
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --src-path site.zip \
            --type zip \
            --clean true

      - name: Smoke test
        run: |
          sleep 15
          curl -fsS "https://${WEBAPP_NAME}.azurewebsites.net" | grep -i "AI Tools Hub"

      - name: Logout
        if: always()
        run: az logout
